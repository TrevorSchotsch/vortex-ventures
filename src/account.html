<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Vortex Ventures</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <nav>
            <a href="index.html" aria-label="Home">
                <img src="../assets/vortex-name.png" alt="Vortex Ventures" class="logo-image">
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="book.html" class="active">Book a Trip</a></li>
            
                <!-- Shown only when logged out -->
                <li id="login-register-links" style="display: none;">
                    <a href="account.html">Log In / Register</a>
                </li>
            
                <!-- Shown only when logged in -->
                <li class="account-dropdown" id="account-dropdown-link" style="display: none;">
                    <a href="account.html">Account ▾</a>
                    <div class="dropdown-content" id="account-dropdown">
                        <!-- Filled in JS -->
                    </div>
                </li>
            </ul>
        </nav>
    </header>
    <!-- Account Section -->
    <main class="account-container">
        <div id="welcome-message"></div>

        <!-- Sign Up Form -->
        <form id="signup-form">
            <h2>Sign Up</h2>
            <input type="text" id="signup-username" placeholder="Username" required>
            <input type="password" id="signup-password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>

        <!-- Login Form -->
        <form id="login-form">
            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Logout Button -->
        <button id="logout-btn" style="display:none;">Logout</button>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Vortex Ventures. All Rights Reserved.</p>
    </footer>

    <div id="custom-alert" class="custom-alert">
        <div class="custom-alert-box">
            <p id="custom-alert-message"></p>
            <button onclick="closeCustomAlert()" class="book-btn">OK</button>
        </div>
    </div>
</body>
